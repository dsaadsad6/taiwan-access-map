name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy but well-formed connection string: build only needs `prisma generate`
      # to succeed and the Prisma Client constructor to see a valid URL — no route
      # in this app queries the database at build time (all routes are dynamic).
      DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
